<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Driving — Web Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            min-height: 100vh;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            padding: 12px;
        }
        .game-wrapper {
            background: #16213e;
            border-radius: 40px;
            padding: 20px 22px 26px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8), 0 0 0 2px #0f3460;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #0b1a2e;
            border-radius: 30px;
            padding: 18px 24px 24px;
            box-shadow: inset 0 0 30px #00000088, 0 0 0 1px #1a3a5c;
        }
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #e0e0e0;
            text-shadow: 0 2px 8px #00b4ff44;
        }
        .title span { color: #ffd966; }
        .cash-board {
            background: #0f3460;
            padding: 6px 20px;
            border-radius: 30px;
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffd966;
            border: 2px solid #1a4a7a;
            box-shadow: inset 0 0 10px #00000066;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .hud {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: #8899aa;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
        .hud-item {
            background: #0a1525;
            padding: 5px 14px;
            border-radius: 20px;
            border: 1px solid #1a3a5c;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .hud-value { color: #e0e0e0; font-weight: 800; }
        .hud-value.warning { color: #ff6b6b; }
        .hud-value.good { color: #66ff99; }
        canvas {
            display: block;
            width: 100%;
            max-width: 520px;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 0 0 3px #1a3a5c, 0 0 30px #00000088;
            background: #1a2a3a;
            cursor: pointer;
        }
        .controls {
            display: flex;
            justify-content: center;
            width: 100%;
            max-width: 520px;
            margin-top: 16px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            background: linear-gradient(180deg, #1a4a7a, #0f2a4a);
            border: 2px solid #2a6a9a;
            border-radius: 40px;
            padding: 10px 22px;
            font-size: 1.1rem;
            font-weight: 800;
            color: #c0d8f0;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 6px 0 #061220, 0 8px 15px black;
            transition: all 0.08s ease;
            text-transform: uppercase;
            flex: 1 0 auto;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #061220, 0 8px 15px black;
        }
        .btn.start-btn { border-color: #66ff99; color: #66ff99; }
        .btn.start-btn:active { box-shadow: 0 2px 0 #061220, 0 8px 15px black, 0 0 20px #66ff9944; }
        .btn.reset-btn { border-color: #ff6b6b; color: #ff6b6b; }
        .instructions {
            margin-top: 14px;
            color: #6a8aaa;
            font-weight: 600;
            font-size: 0.85rem;
            text-align: center;
            background: #0a1525;
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid #1a3a5c;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
            letter-spacing: 1px;
        }
        .key {
            background: #1a3a5c;
            border: 1px solid #2a6a9a;
            border-radius: 6px;
            padding: 1px 10px;
            font-weight: 800;
            color: #7ec8ff;
            font-family: monospace;
        }
        .mission-banner {
            width: 100%;
            max-width: 520px;
            background: #0f3460;
            border: 2px solid #ffd966;
            border-radius: 12px;
            padding: 10px 16px;
            margin-bottom: 10px;
            text-align: center;
            color: #ffd966;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 1px;
            box-shadow: 0 0 15px #ffd96622;
        }
        .mission-banner .sub { color: #a0b8d0; font-weight: 500; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="game-container">
            <div class="header">
                <div class="title">🚗 Dr. <span>Driving</span></div>
                <div class="cash-board">💰 <span id="cashValue">0</span></div>
            </div>

            <div class="hud">
                <div class="hud-item">⏱️ <span class="hud-value" id="timeValue">--</span></div>
                <div class="hud-item">⛽ <span class="hud-value good" id="fuelValue">100%</span></div>
                <div class="hud-item">🚦 <span class="hud-value good" id="speedValue">0 km/h</span></div>
            </div>

            <div class="mission-banner" id="missionBanner">
                🎯 PRESS START TO BEGIN MISSION
            </div>

            <canvas id="gameCanvas" width="520" height="600"></canvas>

            <div class="controls">
                <button class="btn start-btn" id="startBtn">▶ START</button>
                <button class="btn reset-btn" id="resetBtn">⟲ RESET</button>
            </div>

            <div class="instructions">
                <span><span class="key">←</span> <span class="key">→</span> STEER</span>
                <span><span class="key">↑</span> ACCELERATE</span>
                <span><span class="key">↓</span> BRAKE</span>
                <span>TAP SIDES</span>
            </div>
        </div>
    </div>

    <script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const cashSpan = document.getElementById('cashValue');
        const timeSpan = document.getElementById('timeValue');
        const fuelSpan = document.getElementById('fuelValue');
        const speedSpan = document.getElementById('speedValue');
        const missionBanner = document.getElementById('missionBanner');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');

        // ---------- GAME CONSTANTS ----------
        const LANE_COUNT = 3;
        const LANE_WIDTH = canvas.width / LANE_COUNT;
        const CAR_WIDTH = 54;
        const CAR_HEIGHT = 92;
        const PLAYER_FIXED_Y = canvas.height - 85;
        const MAX_SPEED = 120;
        const ACCEL_RATE = 0.35;
        const BRAKE_RATE = 0.5;
        const FRICTION = 0.08;

        // ---------- GAME STATE ----------
        let playerLane = 1;
        let playerX = getCarX(playerLane);
        let targetX = playerX;
        let speed = 0;
        let cash = 0;
        let fuel = 100;
        let timeLeft = 0;
        let maxTime = 0;
        let score = 0;

        let gameActive = false;
        let gameOver = false;
        let missionComplete = false;

        // Traffic
        let traffic = [];
        let trafficSpawnCounter = 0;
        let trafficSpawnRate = 70;

        // Stars / road
        let roadOffset = 0;
        let stars = [];

        // Input
        let keys = { left: false, right: false, up: false, down: false };

        // Mission
        let currentMission = 1;

        // ---------- HELPERS ----------
        function getCarX(lane) {
            return lane * LANE_WIDTH + LANE_WIDTH / 2;
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < 60; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 1.5 + 0.3,
                    speed: Math.random() * 0.3 + 0.1,
                    brightness: Math.random() * 0.5 + 0.3,
                });
            }
        }
        initStars();

        function updateHUD() {
            cashSpan.textContent = Math.floor(cash);
            fuelSpan.textContent = Math.floor(fuel) + '%';
            fuelSpan.className = 'hud-value ' + (fuel < 25 ? 'warning' : 'good');
            const kmh = Math.floor(speed * 1.8);
            speedSpan.textContent = kmh + ' km/h';
            speedSpan.className = 'hud-value ' + (kmh > 90 ? 'warning' : 'good');
            if (timeLeft > 0) {
                timeSpan.textContent = Math.floor(timeLeft) + 's';
            } else {
                timeSpan.textContent = '--';
            }
        }

        function showMission(text, sub) {
            missionBanner.innerHTML = '🎯 ' + text + (sub ? '<br><span class="sub">' + sub + '</span>' : '');
        }

        // ---------- MISSION SETUP ----------
        function setupMission(n) {
            currentMission = n;
            fuel = 100;
            traffic = [];
            trafficSpawnCounter = 0;
            speed = 0;
            playerLane = 1;
            playerX = getCarX(playerLane);
            targetX = playerX;

            if (n === 1) {
                maxTime = 60;
                timeLeft = 60;
                trafficSpawnRate = 80;
                showMission('MISSION 1: SAFE DRIVE', 'Reach the end without crashing. Time limit: 60s');
            } else if (n === 2) {
                maxTime = 45;
                timeLeft = 45;
                trafficSpawnRate = 55;
                showMission('MISSION 2: RUSH HOUR', 'Faster traffic! Time limit: 45s');
            } else {
                maxTime = 35;
                timeLeft = 35;
                trafficSpawnRate = 40;
                showMission('MISSION ' + n + ': EXPERT', 'Heavy traffic! Time limit: 35s');
            }
            updateHUD();
        }

        // ---------- RESET ----------
        function resetGame() {
            if (animationFrame) { cancelAnimationFrame(animationFrame); animationFrame = null; }
            gameActive = false;
            gameOver = false;
            missionComplete = false;
            cash = 0;
            score = 0;
            fuel = 100;
            timeLeft = 0;
            speed = 0;
            playerLane = 1;
            playerX = getCarX(playerLane);
            targetX = playerX;
            traffic = [];
            roadOffset = 0;
            currentMission = 1;
            initStars();
            updateHUD();
            showMission('PRESS START TO BEGIN MISSION', '');
            draw();
        }

        // ---------- START ----------
        function startGame() {
            if (gameActive) return;
            if (gameOver || missionComplete) {
                cash = 0;
                currentMission = 1;
            }
            gameActive = true;
            gameOver = false;
            missionComplete = false;
            setupMission(currentMission);
            if (animationFrame) cancelAnimationFrame(animationFrame);
            animationFrame = requestAnimationFrame(gameLoop);
        }

        // ---------- SPAWN TRAFFIC ----------
        function spawnTraffic() {
            const lane = Math.floor(Math.random() * LANE_COUNT);
            // avoid spawning on player
            if (lane === playerLane && traffic.some(t => t.y < CAR_HEIGHT * 2)) return;
            const tooClose = traffic.some(t => t.lane === lane && t.y < CAR_HEIGHT * 2.5);
            if (tooClose) return;

            const isTruck = Math.random() < 0.15;
            traffic.push({
                lane: lane,
                y: -CAR_HEIGHT,
                width: isTruck ? 68 : CAR_WIDTH,
                height: isTruck ? 110 : CAR_HEIGHT,
                color: isTruck ? '#cc5500' : '#cc3333',
                speed: isTruck ? 0.6 : 0.8,
            });
        }

        // ---------- COLLISION ----------
        function checkCollision(r1, r2) {
            return !(r1.x + r1.w < r2.x || r2.x + r2.w < r1.x ||
                     r1.y + r1.h < r2.y || r2.y + r2.h < r1.y);
        }

        // ---------- UPDATE ----------
        function update() {
            if (!gameActive || gameOver || missionComplete) return;

            // Time
            timeLeft -= 1/60;
            if (timeLeft <= 0) {
                timeLeft = 0;
                missionComplete = true;
                gameActive = false;
                if (animationFrame) { cancelAnimationFrame(animationFrame); animationFrame = null; }
                updateHUD();
                draw();
                return;
            }

            // Speed control
            if (keys.up) {
                speed = Math.min(speed + ACCEL_RATE, MAX_SPEED);
            } else if (keys.down) {
                speed = Math.max(speed - BRAKE_RATE, 0);
            } else {
                speed = Math.max(speed - FRICTION, 0);
            }

            // Fuel consumption (only when moving)
            if (speed > 0) {
                fuel -= speed * 0.0004;
                if (fuel <= 0) { fuel = 0; gameOver = true; gameActive = false;
                    if (animationFrame) { cancelAnimationFrame(animationFrame); animationFrame = null; }
                    updateHUD(); draw(); return;
                }
            }

            // Steering
            const steerSpeed = 0.12 * (speed / MAX_SPEED + 0.3);
            if (keys.left) targetX -= steerSpeed * 8;
            if (keys.right) targetX += steerSpeed * 8;
            targetX = Math.max(CAR_WIDTH/2, Math.min(canvas.width - CAR_WIDTH/2, targetX));

            // Smooth player X movement
            playerX += (targetX - playerX) * 0.2;
            // Update lane based on position
            playerLane = Math.round((playerX - LANE_WIDTH/2) / LANE_WIDTH);
            playerLane = Math.max(0, Math.min(LANE_COUNT - 1, playerLane));

            // Road offset
            roadOffset = (roadOffset + speed * 1.5) % 60;

            // Stars
            stars.forEach(s => {
                s.y += s.speed * (speed / 30 + 0.5);
                if (s.y > canvas.height) { s.y = -5; s.x = Math.random() * canvas.width; }
            });

            // Traffic spawning
            trafficSpawnCounter++;
            if (trafficSpawnCounter >= trafficSpawnRate) {
                spawnTraffic();
                trafficSpawnCounter = 0;
            }

            // Move traffic
            for (let i = traffic.length - 1; i >= 0; i--) {
                const t = traffic[i];
                t.y += (speed * 0.35 + t.speed * 1.5);
                if (t.y > canvas.height + 120) {
                    traffic.splice(i, 1);
                    cash += 5;
                    score += 10;
                }
            }

            // Collision
            const playerRect = {
                x: playerX - CAR_WIDTH/2, y: PLAYER_FIXED_Y - CAR_HEIGHT/2,
                w: CAR_WIDTH, h: CAR_HEIGHT
            };
            for (let t of traffic) {
                const tRect = {
                    x: getCarX(t.lane) - t.width/2, y: t.y - t.height/2,
                    w: t.width, h: t.height
                };
                if (checkCollision(playerRect, tRect)) {
                    gameOver = true;
                    gameActive = false;
                    speed = 0;
                    if (animationFrame) { cancelAnimationFrame(animationFrame); animationFrame = null; }
                    updateHUD();
                    draw();
                    return;
                }
            }

            updateHUD();
        }

        // ---------- DRAW ----------
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Background
            const bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bg.addColorStop(0, '#0a1525');
            bg.addColorStop(1, '#1a2a3a');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Stars
            stars.forEach(s => {
                ctx.globalAlpha = s.brightness;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            // Road
            ctx.fillStyle = '#1e2e3e';
            ctx.fillRect(20, 0, canvas.width - 40, canvas.height);

            // Lane dividers (dashed, scrolling)
            ctx.strokeStyle = '#f0f0f0';
            ctx.lineWidth = 3;
            ctx.setLineDash([20, 20]);
            ctx.lineDashOffset = -roadOffset;
            for (let i = 1; i < LANE_COUNT; i++) {
                const x = 20 + i * ((canvas.width - 40) / LANE_COUNT);
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            ctx.setLineDash([]);
            ctx.lineDashOffset = 0;

            // Road edges
            ctx.fillStyle = '#ffb347';
            ctx.fillRect(16, 0, 6, canvas.height);
            ctx.fillRect(canvas.width - 22, 0, 6, canvas.height);

            // Traffic cars
            traffic.forEach(t => {
                const x = getCarX(t.lane) - t.width/2;
                const y = t.y - t.height/2;
                ctx.fillStyle = t.color;
                ctx.beginPath();
                ctx.roundRect(x, y, t.width, t.height, 10);
                ctx.fill();
                // Windows
                ctx.fillStyle = '#1a2a3a';
                ctx.beginPath();
                ctx.roundRect(x + 8, y + 12, t.width - 16, 24, 6);
                ctx.fill();
                // Lights
                ctx.fillStyle = '#ffd966';
                ctx.beginPath();
                ctx.arc(x + 10, y + t.height - 6, 5, 0, Math.PI * 2);
                ctx.arc(x + t.width - 10, y + t.height - 6, 5, 0, Math.PI * 2);
                ctx.fill();
            });

            // Player car
            const px = playerX - CAR_WIDTH/2;
            const py = PLAYER_FIXED_Y - CAR_HEIGHT/2;
            ctx.fillStyle = '#4cc9f0';
            ctx.beginPath();
            ctx.roundRect(px, py, CAR_WIDTH, CAR_HEIGHT, 12);
            ctx.fill();
            // Windows
            ctx.fillStyle = '#caf0f8';
            ctx.beginPath();
            ctx.roundRect(px + 6, py + 10, CAR_WIDTH - 12, 22, 6);
            ctx.fill();
            ctx.fillStyle = '#023e8a';
            ctx.beginPath();
            ctx.roundRect(px + 8, py + 44, CAR_WIDTH - 16, 18, 5);
            ctx.fill();
            // Headlights
            ctx.fillStyle = '#ffea00';
            ctx.beginPath();
            ctx.arc(px + 12, py + 8, 6, 0, Math.PI * 2);
            ctx.arc(px + CAR_WIDTH - 12, py + 8, 6, 0, Math.PI * 2);
            ctx.fill();

            // Overlays
            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.font = 'bold 48px "Segoe UI", sans-serif';
                ctx.fillStyle = '#ff4444';
                ctx.textAlign = 'center';
                ctx.fillText('💥 CRASHED', canvas.width/2, canvas.height/2 - 20);
                ctx.font = 'bold 28px "Segoe UI", sans-serif';
                ctx.fillStyle = '#e0e0e0';
                ctx.fillText('Press START to retry', canvas.width/2, canvas.height/2 + 50);
            } else if (missionComplete) {
                ctx.fillStyle = 'rgba(0,0,0,0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.font = 'bold 44px "Segoe UI", sans-serif';
                ctx.fillStyle = '#66ff99';
                ctx.textAlign = 'center';
                ctx.fillText('✅ MISSION COMPLETE!', canvas.width/2, canvas.height/2 - 20);
                ctx.font = 'bold 26px "Segoe UI", sans-serif';
                ctx.fillStyle = '#ffd966';
                ctx.fillText('Earned: $' + Math.floor(score + cash), canvas.width/2, canvas.height/2 + 40);
                ctx.font = 'bold 22px "Segoe UI", sans-serif';
                ctx.fillStyle = '#e0e0e0';
                ctx.fillText('Press START for next mission', canvas.width/2, canvas.height/2 + 90);
            } else if (!gameActive && !gameOver && !missionComplete) {
                ctx.font = 'bold 38px "Segoe UI", sans-serif';
                ctx.fillStyle = '#e0e0e0';
                ctx.textAlign = 'center';
                ctx.fillText('🚗 Dr. Driving', canvas.width/2, canvas.height/2 - 40);
                ctx.font = 'bold 22px "Segoe UI", sans-serif';
                ctx.fillStyle = '#8899aa';
                ctx.fillText('Realistic driving simulation', canvas.width/2, canvas.height/2 + 10);
                ctx.font = 'bold 20px "Segoe UI", sans-serif';
                ctx.fillStyle = '#ffd966';
                ctx.fillText('Press START', canvas.width/2, canvas.height/2 + 70);
            }
        }

        // Helper roundRect
        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
            if (w < 2*r) r = w/2;
            if (h < 2*r) r = h/2;
            this.moveTo(x+r, y);
            this.lineTo(x+w-r, y);
            this.quadraticCurveTo(x+w, y, x+w, y+r);
            this.lineTo(x+w, y+h-r);
            this.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
            this.lineTo(x+r, y+h);
            this.quadraticCurveTo(x, y+h, x, y+h-r);
            this.lineTo(x, y+r);
            this.quadraticCurveTo(x, y, x+r, y);
            return this;
        };

        // ---------- GAME LOOP ----------
        function gameLoop() {
            if (!gameActive) {
                if (animationFrame) { cancelAnimationFrame(animationFrame); animationFrame = null; }
                return;
            }
            update();
            draw();
            if (gameActive && !gameOver && !missionComplete) {
                animationFrame = requestAnimationFrame(gameLoop);
            } else {
                if (animationFrame) { cancelAnimationFrame(animationFrame); animationFrame = null; }
            }
        }

        // ---------- INPUT ----------
        window.addEventListener('keydown', (e) => {
            const k = e.key;
            if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = true; e.preventDefault(); }
            if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = true; e.preventDefault(); }
            if (k === 'ArrowUp' || k === 'w' || k === 'W') { keys.up = true; e.preventDefault(); }
            if (k === 'ArrowDown' || k === 's' || k === 'S') { keys.down = true; e.preventDefault(); }
            if (k === ' ' || k === 'Space') { e.preventDefault(); if (!gameActive) startGame(); }
            if (k === 'r' || k === 'R') { resetGame(); draw(); }
        });

        window.addEventListener('keyup', (e) => {
            const k = e.key;
            if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
            if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
            if (k === 'ArrowUp' || k === 'w' || k === 'W') keys.up = false;
            if (k === 'ArrowDown' || k === 's' || k === 'S') keys.down = false;
        });

        // Touch/click steering
        canvas.addEventListener('click', (e) => {
            if (!gameActive) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const cx = (e.clientX - rect.left) * scaleX;
            if (cx < canvas.width / 2) targetX -= 60;
            else targetX += 60;
            targetX = Math.max(CAR_WIDTH/2, Math.min(canvas.width - CAR_WIDTH/2, targetX));
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!gameActive) return;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const scaleX = canvas.width / rect.width;
            const cx = (touch.clientX - rect.left) * scaleX;
            if (cx < canvas.width / 2) targetX -= 60;
            else targetX += 60;
            targetX = Math.max(CAR_WIDTH/2, Math.min(canvas.width - CAR_WIDTH/2, targetX));
        }, { passive: false });

        // Buttons
        startBtn.addEventListener('click', startGame);
        resetBtn.addEventListener('click', () => { resetGame(); draw(); });

        // Prevent scroll
        window.addEventListener('keydown', (e) => {
            if ([' ','Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
        }, { passive: false });

        // ---------- INIT ----------
        resetGame();
        draw();
    })();
    </script>
</body>
</html>
